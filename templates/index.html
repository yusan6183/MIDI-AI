<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>MIDI Upload Test</title>
</head>

<body>

<h1>MIDI Upload Test</h1>

<form method="POST"
      enctype="multipart/form-data">

    <input
        type="file"
        name="midi_file"
        accept=".mid,.midi"
        required
    >

    <br><br>

    <input
        type="text"
        name="intention"
        placeholder="曲の意図"
    >

    <br><br>

    <button type="submit">
        アップロード
    </button>

</form>

</body>
</html>
